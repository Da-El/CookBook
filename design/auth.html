<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · CookBook</title>
  <link rel="stylesheet" href="styles.css" />
  <script>
    try {
      var t = localStorage.getItem("cookbook-theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="brand">
        <span class="brand-mark" aria-hidden="true">🍳</span>
        <span class="brand-name">Cook<em>Book</em></span>
      </a>
      <h1>Welcome back</h1>
      <p class="lead">Sign in to your kitchen. Your feed, fridge, and recipes stay private until you share them.</p>

      <div class="oauth-stack">
        <button type="button" class="oauth-btn">Continue with Apple</button>
        <button type="button" class="oauth-btn">Continue with Google</button>
      </div>

      <div class="divider">or email &amp; password</div>

      <form action="index.html" method="get">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="you@kitchen.com" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••••••" required />
        </div>
        <div class="auth-links">
          <label class="check-label">
            <input type="checkbox" checked /> Remember this device
          </label>
          <a href="#">Forgot password?</a>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Sign in</button>
      </form>

      <div class="security-note">
        Short-lived sessions, rotating refresh tokens, and secure cookies. Optional passkeys &amp; MFA live in Settings.
      </div>

      <p class="auth-footer">
        New here? <a href="auth-signup.html">Create an account</a>
      </p>
    </div>

    <button type="button" class="icon-chip auth-theme" data-theme-toggle aria-pressed="false" title="Dark mode">
      <span data-theme-icon>🌙</span>
    </button>
  </div>
  <script src="theme.js"></script>
</body>
</html>
