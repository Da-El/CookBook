# Render Blueprint for grok-cookbook
# Deploy: New → Blueprint → connect this repo

services:
  - type: web
    name: grok-cookbook-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: grok-cookbook-db
          property: connectionString
      - key: CATALOG_PATH
        value: /app/catalog.json
      - key: STATIC_DIR
        value: /app/static
      - key: RUST_LOG
        value: grok_cookbook_api=info,tower_http=info
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: grok-cookbook-db
    plan: free
    databaseName: grok_cookbook
    user: grok_cookbook
