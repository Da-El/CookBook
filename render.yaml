# Render Blueprint for CookBook (repo: grok-cookbook)
# Dashboard: New → Blueprint → connect Da-El/grok-cookbook
# Or CLI: create postgres + web service (see DEPLOY.md)

services:
  - type: web
    name: cookbook
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cookbook-db
          property: connectionString
      - key: CATALOG_PATH
        value: /app/catalog.json
      - key: STATIC_DIR
        value: /app/static
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: RUST_LOG
        value: grok_cookbook_api=info,tower_http=info
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: cookbook-db
    plan: free
    databaseName: grok_cookbook
    user: grok_cookbook
    region: oregon
